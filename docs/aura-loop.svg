    <circle cx="375" cy="111" r="15" fill="#E7C15A" fill-opacity="0.18" stroke="#E7C15A"/>
    <path d="M369 111C369 107.7 371.7 105 375 105C378.3 105 381 107.7 381 111C381 114.3 378.3 117 375 117C371.7 117 369 114.3 369 111Z" stroke="#E7C15A" stroke-width="2"/>
